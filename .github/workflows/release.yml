name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  release:
    needs: tests
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 scripts/build-release.py --version "$VERSION"
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "WebAnyOne Form Field Duplicator $VERSION" \
            --notes-file "docs/releases/$VERSION.md" \
            "dist/WebAnyOneFormFieldDuplicatorBundle-$VERSION.zip" \
            "dist/WebAnyOneFormFieldDuplicatorBundle-$VERSION.zip.sha256"
